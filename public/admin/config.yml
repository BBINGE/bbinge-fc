backend:
  name: github
  repo: BBINGE/bbinge-fc
  branch: main
  base_url: https://bbinge-fc.pages.dev

locale: 'ko'

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: 설정
    files:
      - name: categories
        label: 카테고리
        file: src/data/categories.json
        fields:
          - label: 카테고리 목록
            name: categories
            widget: list
            summary: '{{fields.label}} ({{fields.slug}})'
            fields:
              - { label: 'slug (영문 소문자·숫자·하이픈만, 발행된 글이 있으면 바꾸지 말 것)', name: slug, widget: string, pattern: ['^[a-z0-9-]+$', '영문 소문자, 숫자, 하이픈만 사용'] }
              - { label: 표시명 (짧게, 메뉴에 노출), name: label, widget: string }
              - { label: 페이지 제목 (선택), name: pageTitle, widget: string, required: false, hint: '메뉴명보다 긴 카테고리 제목이 필요할 때만 입력한다.' }
              - { label: 전체 표시명 (카테고리 페이지 부제), name: fullLabel, widget: string }
              - { label: 카테고리 설명 (선택), name: description, widget: text, required: false }
              - { label: 빈 카테고리 안내 (선택), name: emptyMessage, widget: text, required: false }
              - { label: '상위 카테고리 slug (최상위면 비워둘 것)', name: parentSlug, widget: string, required: false, hint: '다른 카테고리 항목의 slug 값을 그대로 입력. 대분류면 비워둔다.' }
  - name: articles
    label: 글
    label_singular: 글
    folder: src/content/articles
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    identifier_field: title
    summary: '{{title}} - {{category}}'
    sortable_fields: [pubDate, title]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 설명 (검색결과에 노출), name: description, widget: text }
      - { label: '목록 미리보기 제목 (축세 발행 필수)', name: previewTitle, widget: string, required: false, hint: '상세 제목을 복사하지 말고, 대상을 앞에 두어 클릭하면 어떤 답을 얻는지 12~42자 안에서 보여주세요. 검색·상세 제목은 바뀌지 않습니다.' }
      - { label: '목록 미리보기 설명 (축세 발행 필수)', name: previewDescription, widget: text, required: false, hint: '원고가 실제로 답하는 원인·변화·비교·발견을 35~110자로 적으세요. 검색 설명은 바뀌지 않습니다.' }
      - label: 카테고리
        name: category
        widget: relation
        collection: settings
        file: categories
        value_field: 'categories.*.slug'
        search_fields: ['categories.*.label', 'categories.*.slug']
        display_fields: ['categories.*.label']
      - { label: 태그, name: tags, widget: list, default: [] }
      - { label: 발행일, name: pubDate, widget: datetime }
      - { label: 수정일, name: updatedDate, widget: datetime, required: false }
      - { label: 대표 이미지, name: coverImage, widget: image, required: false, hint: '검색·공유·글 상단에 동일하게 노출됩니다. 발행 글은 반드시 지정하세요.' }
      - { label: 대표 이미지 설명, name: coverImageAlt, widget: string, required: false, hint: '사진 속 대상과 장면을 짧고 정확하게 적으세요.' }
      - { label: 대표 이미지 캡션, name: coverImageCaption, widget: text, required: false }
      - { label: 대표 이미지 가로(px), name: coverImageWidth, widget: number, value_type: int, min: 1, required: false }
      - { label: 대표 이미지 세로(px), name: coverImageHeight, widget: number, value_type: int, min: 1, required: false }
      - { label: 갤러리 이미지, name: gallery, widget: list, field: { label: 이미지, name: image, widget: image }, required: false }
      - label: FAQ (선택)
        name: faq
        widget: list
        required: false
        fields:
          - { label: 질문, name: question, widget: string }
          - { label: 답변, name: answer, widget: text }
      - { label: 초안 (체크하면 사이트에 안 보임), name: draft, widget: boolean, default: true }
      - { label: '이번 주 HOT (홈 히어로 노출, 직접 켜고 끔)', name: featured, widget: boolean, default: false }
      - { label: 본문, name: body, widget: markdown }
