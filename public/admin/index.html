<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>BBinge FC 관리자</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      var CATEGORY_LABELS = { history: '역사', pilgrimage: '순례', play: '놀이', culture: '컬쳐' };

      var SeoPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title']) || '';
          var description = entry.getIn(['data', 'description']) || '';
          var category = entry.getIn(['data', 'category']) || '';
          var slug = entry.get('slug') || '';
          var url = 'https://bbingefc.com/' + category + '/' + slug + '/';

          var titleOver = title.length > 60;
          var descOver = description.length > 155;

          return h(
            'div',
            { style: { fontFamily: 'sans-serif', padding: '16px' } },
            h('p', { style: { fontSize: '12px', color: '#888', marginBottom: '8px' } }, 'Google 검색결과 미리보기'),
            h(
              'div',
              { style: { border: '1px solid #e0e0e0', borderRadius: '8px', padding: '14px', marginBottom: '10px' } },
              h('div', { style: { color: '#1a0dab', fontSize: '18px', lineHeight: '1.3' } }, title || '(제목 없음)'),
              h('div', { style: { color: '#006621', fontSize: '13px', margin: '2px 0' } }, url),
              h('div', { style: { color: '#545454', fontSize: '13px' } }, description || '(설명 없음)')
            ),
            h(
              'p',
              { style: { fontSize: '12px', color: titleOver ? '#c62828' : '#888' } },
              '제목 ' + title.length + '자 (권장 60자 이내)' + (titleOver ? ' — 너무 길어요, 검색결과에서 잘려요' : '')
            ),
            h(
              'p',
              { style: { fontSize: '12px', color: descOver ? '#c62828' : '#888' } },
              '설명 ' + description.length + '자 (권장 155자 이내)' + (descOver ? ' — 너무 길어요, 검색결과에서 잘려요' : '')
            ),
            h('hr', { style: { margin: '16px 0', border: 'none', borderTop: '1px solid #eee' } }),
            h(
              'p',
              { style: { fontSize: '12px', color: '#888', marginBottom: '8px' } },
              '카테고리: ' + (CATEGORY_LABELS[category] || category)
            ),
            this.props.widgetFor('body')
          );
        },
      });

      CMS.registerPreviewTemplate('articles', SeoPreview);
    </script>
  </body>
</html>
