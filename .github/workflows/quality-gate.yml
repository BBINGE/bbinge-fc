name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test editorial writing rules
        run: npm run test:writing-rules
      - name: Validate editorial writing
        run: npm run validate:writing
      - name: Test player archive rules
        run: npm run test:player-rules
      - name: Validate player archives
        run: npm run validate:players
      - name: Build site
        run: npm run build
