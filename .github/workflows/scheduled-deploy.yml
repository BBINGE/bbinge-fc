name: Scheduled deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/data/today-football.json'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh and validate today's football data
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          node scripts/fetch-today-football.mjs
          node scripts/validate-today-football.mjs

      - name: Save refreshed data
        id: refresh
        run: |
          if git diff --quiet -- src/data/today-football.json; then
            echo "Today's data is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/today-football.json
            git commit -m "데이터: 오늘의 축구 자동 갱신"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether deployment is needed
        id: deploy
        env:
          DATA_CHANGED: ${{ steps.refresh.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          current_hour="$(date -u +%H)"
          if [ "$EVENT_NAME" != "schedule" ] || [ "$DATA_CHANGED" = "true" ] || [ $((10#$current_hour % 6)) -eq 0 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call Cloudflare Pages deploy hook
        if: steps.deploy.outputs.needed == 'true'
        run: |
          curl -fsS -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"

      - name: Verify production deployment
        if: steps.deploy.outputs.needed == 'true'
        run: |
          expected_sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 40); do
            deployed_sha="$(curl -fsS --max-time 20 "https://bbinge-fc.pages.dev/deploy.json?attempt=${attempt}" | node -e "let input=''; process.stdin.on('data',c=>input+=c); process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(input).commit||'')}catch{}})")"
            if [ "$deployed_sha" = "$expected_sha" ]; then
              echo "Production deployment confirmed: $deployed_sha"
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/40): ${deployed_sha:-not available}"
            sleep 15
          done
          echo "Production did not reach commit $expected_sha within 10 minutes."
          exit 1
