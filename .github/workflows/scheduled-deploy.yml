name: Scheduled deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/data/today-football.json'
      - 'src/data/football-birthday-fallbacks.json'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh and validate today's football data
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          node scripts/fetch-today-football.mjs
          node scripts/validate-today-football.mjs

      - name: Save refreshed data
        run: |
          if git diff --quiet -- src/data/today-football.json src/data/football-birthday-fallbacks.json; then
            echo "Today's data is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/today-football.json src/data/football-birthday-fallbacks.json
            git commit -m "데이터: 오늘의 축구 자동 갱신"
            git push origin HEAD:main
          fi

      - name: Call Cloudflare Pages deploy hook
        run: |
          curl -fsS -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"

      - name: Verify production deployment
        run: |
          expected_sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 20); do
            deployed_sha="$(curl -fsS --max-time 20 "https://bbinge-fc.pages.dev/deploy.json?attempt=${attempt}" | node -e "let input=''; process.stdin.on('data',c=>input+=c); process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(input).commit||'')}catch{}})")"
            if [ "$deployed_sha" = "$expected_sha" ]; then
              echo "Production deployment confirmed: $deployed_sha"
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/20): ${deployed_sha:-not available}"
            sleep 15
          done
          echo "Production did not reach commit $expected_sha within 5 minutes."
          exit 1
